[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-cloudflare-turnstile"
version = "1.0.0"
description = "Find the Cloudflare Turnstile sitekey on any page and create a valid Turnstile token via the Peak API - Python, dependency-free, CLI-ready for CI and automation."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Peak" }]
keywords = [
  "cloudflare", "cloudflare-turnstile", "turnstile", "turnstile-token",
  "turnstile-solver", "python", "captcha", "captcha-token", "captcha-solver",
  "web-scraping", "scraper", "anti-bot", "token", "cli", "automation", "peak",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
python-cloudflare-turnstile = "python_cloudflare_turnstile:main"

[project.urls]
Homepage = "https://peak.fo/?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=python-cloudflare-turnstile"
Documentation = "https://peak.fo/docs/turnstile?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=python-cloudflare-turnstile"
Pricing = "https://peak.fo/pricing?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=python-cloudflare-turnstile"
Source = "https://peak.fo/?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=python-cloudflare-turnstile"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
  "python_cloudflare_turnstile.py",
  "README.md",
  "LICENSE",
  "examples",
]